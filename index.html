<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seenaa Sahaabaa</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f4f7f5;
  color:#17221d;
  transition:.3s;
}

body.dark{
  background:#101613;
  color:#eee;
}

header{
  background:linear-gradient(135deg,#075e54,#0b806f);
  color:white;
  padding:22px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:27px;
  margin-bottom:7px;
}

header p{
  font-size:14px;
  opacity:.9;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.searchBox{
  position:relative;
  margin-bottom:15px;
}

#searchInput{
  width:100%;
  padding:16px 48px 16px 18px;
  border:none;
  border-radius:15px;
  font-size:16px;
  outline:none;
  box-shadow:0 3px 12px #0001;
}

.dark #searchInput{
  background:#1b2420;
  color:white;
}

.searchIcon{
  position:absolute;
  right:17px;
  top:15px;
  font-size:20px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 15px;
}

.categories button{
  border:none;
  padding:10px 15px;
  border-radius:20px;
  background:white;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 7px #0001;
}

.dark .categories button{
  background:#1b2420;
  color:white;
}

.categories button.active{
  background:#075e54;
  color:white;
}

.info{
  background:#e3f3ee;
  padding:13px;
  border-radius:12px;
  margin-bottom:15px;
  font-size:14px;
}

.dark .info{
  background:#1a2924;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 15px #0001;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.dark .card{
  background:#1b2420;
}

.avatar{
  height:125px;
  border-radius:15px;
  background:linear-gradient(135deg,#075e54,#15a58e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  margin-bottom:13px;
}

.card h2{
  font-size:19px;
  margin-bottom:5px;
}

.arabic{
  direction:rtl;
  font-size:18px;
  color:#087a68;
  margin-bottom:8px;
}

.dark .arabic{
  color:#54cdb5;
}

.tag{
  display:inline-block;
  padding:5px 9px;
  background:#e4f4ef;
  color:#075e54;
  border-radius:12px;
  font-size:12px;
  margin-top:5px;
}

.dark .tag{
  background:#203a33;
  color:#7be0ca;
}

.card p{
  margin-top:10px;
  line-height:1.6;
  font-size:14px;
}

#detail{
  display:none;
}

.backBtn{
  border:none;
  background:#075e54;
  color:white;
  padding:11px 16px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:15px;
}

.detailCard{
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 4px 18px #0001;
}

.dark .detailCard{
  background:#1b2420;
}

.detailAvatar{
  height:190px;
  border-radius:18px;
  background:linear-gradient(135deg,#075e54,#18a58e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  margin-bottom:18px;
}

.detailCard h1{
  font-size:27px;
  margin-bottom:5px;
}

.detailArabic{
  direction:rtl;
  font-size:24px;
  color:#087a68;
  margin-bottom:15px;
}

.dark .detailArabic{
  color:#69ddc5;
}

.section{
  margin-top:22px;
}

.section h3{
  color:#075e54;
  margin-bottom:8px;
  border-bottom:2px solid #075e54;
  padding-bottom:6px;
}

.dark .section h3{
  color:#70ddc7;
}

.section p{
  line-height:1.9;
  font-size:16px;
}

.lessons{
  padding-left:20px;
  line-height:1.9;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

.actions button{
  border:none;
  padding:11px 15px;
  border-radius:12px;
  cursor:pointer;
  background:#075e54;
  color:white;
}

.empty{
  text-align:center;
  padding:45px 15px;
}

.empty div{
  font-size:50px;
  margin-bottom:10px;
}

.themeBtn{
  position:absolute;
  right:12px;
  top:15px;
  border:none;
  background:#ffffff22;
  color:white;
  padding:9px;
  border-radius:10px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <button class="themeBtn" onclick="toggleDark()">🌙</button>
  <h1>📖 Seenaa Sahaabaa</h1>
  <p>Seenaa sahaabota Radhiyallaahu ‘anhum baradhu</p>
</header>

<div class="container">

  <div id="home">

    <div class="searchBox">
      <input
        id="searchInput"
        type="text"
        placeholder="🔎 Maqaa sahaabaa barbaadi..."
        oninput="searchSahaba()"
      >
      <span class="searchIcon">🔍</span>
    </div>

    <div class="categories">
      <button class="active" onclick="filterCategory('Hundaa',this)">
        Hundaa
      </button>

      <button onclick="filterCategory('Khulafaa',this)">
        Khulafaa
      </button>

      <button onclick="filterCategory('Muhajir',this)">
        Muhajir
      </button>

      <button onclick="filterCategory('Ansaar',this)">
        Ansaar
      </button>

      <button onclick="filterCategory('Hadith',this)">
        Hayyoota Hadith
      </button>
    </div>

    <div class="info">
      🔎 <b>Akkaataa barbaacha:</b>
      Maqaa Afaan Oromoo, Arabiffaa, English ykn kunyaa barreessi.
      Fakkeenyaaf:
      <b>Abu Bakr</b>, <b>Umar</b>, <b>Bilal</b>,
      <b>أبو بكر</b>, <b>عمر</b>.
    </div>

    <div id="resultInfo"></div>

    <div id="sahabaList" class="grid"></div>

  </div>

  <div id="detail"></div>

</div>

<footer>
  📚 Seenaa Sahaabaa — Barnoota, yaadannoo fi qophii barnoota Islaamaa
</footer>

/* =========================
   NORMALIZE SEARCH
========================= */

function normalize(text){

  return text
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"")
    .replace(/ـ/g,"")
    .replace(/[’']/g,"")
    .trim();

}


/* =========================
   RENDER LIST
========================= */

function renderList(list){

  const container = document.getElementById("sahabaList");

  document.getElementById("resultInfo").innerHTML =
    `<div class="info">📚 <b>${list.length}</b> seenaa argame.</div>`;

  if(list.length === 0){

    container.innerHTML = `
      <div class="empty">
        <div>🔎</div>
        <h2>Hin argamne</h2>
        <p>Maqaa sahaabaa sirriitti barreessi.</p>
        <p>Fakkeenya: Abu Bakr, Umar, Bilal, Aisha</p>
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(item => `

    <div class="card" onclick="openStory('${item.id}')">

      <div class="avatar">${item.icon}</div>

      <h2>${item.name}</h2>

      <div class="arabic">
        ${item.arabic}
      </div>

      ${item.category.map(c =>
        `<span class="tag">${c}</span>`
      ).join(" ")}

      <p>${item.short}</p>

    </div>

  `).join("");

}


/* =========================
   SEARCH
========================= */

let currentCategory = "Hundaa";

function searchSahaba(){

  const query =
    normalize(document.getElementById("searchInput").value);

  let results = sahaba;

  if(currentCategory !== "Hundaa"){

    results = results.filter(item =>
      item.category.includes(currentCategory)
    );

  }

  if(query !== ""){

    results = results.filter(item => {

      const text = normalize(`
        ${item.name}
        ${item.arabic}
        ${item.aliases.join(" ")}
        ${item.short}
        ${item.story}
        ${item.category.join(" ")}
      `);

      return text.includes(query);

    });

  }

  renderList(results);

}


/* =========================
   CATEGORY
========================= */

function filterCategory(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  searchSahaba();

}


/* =========================
   OPEN STORY
========================= */

function openStory(id){

  const item = sahaba.find(x => x.id === id);

  if(!item) return;

  document.getElementById("home").style.display = "none";

  const detail = document.getElementById("detail");

  detail.style.display = "block";

  const paragraphs = item.story
    .trim()
    .split(/\n\s*\n/)
    .map(p => `<p>${p.trim()}</p>`)
    .join("");

  detail.innerHTML = `

    <button class="backBtn" onclick="goHome()">
      ← Gara
    </button>

    <div class="detailCard">

      <div class="detailAvatar">
        ${item.icon}
      </div>

      <h1>${item.name}</h1>

      <div class="detailArabic">
        ${item.arabic}
      </div>

      <div>
        ${item.category.map(c =>
          `<span class="tag">${c}</span>`
        ).join(" ")}
      </div>

      <div class="section">

        <h3>📖 Seenaa isaa/ishee</h3>

        ${paragraphs}

      </div>

      <div class="section">

        <h3>💡 Barumsa irraa argannu</h3>

        <ul class="lessons">

          ${item.lessons.map(l =>
            `<li>${l}</li>`
          ).join("")}

        </ul>

      </div>

      <div class="section">

        <h3>📚 Madda</h3>

        <p>${item.source}</p>

      </div>

      <div class="actions">

        <button onclick="shareStory('${item.id}')">
          📤 Qoodi
        </button>

        <button onclick="copyStory('${item.id}')">
          📋 Copy
        </button>

      </div>

    </div>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   HOME
========================= */

function goHome(){

  document.getElementById("detail").style.display = "none";

  document.getElementById("home").style.display = "block";

  searchSahaba();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
  );

}

if(localStorage.getItem("darkMode") === "true"){
  document.body.classList.add("dark");
}


/* =========================
   SHARE
========================= */

function shareStory(id){

  const item = sahaba.find(x => x.id === id);

  if(!item) return;

  const text =
`${item.name}

${item.short}

Seenaa Sahaabaa`;

  if(navigator.share){

    navigator.share({
      title:item.name,
      text:text
    });

  }else{

    navigator.clipboard.writeText(text);

    alert("Barreeffamni qoodamuuf copy ta'eera.");

  }

}


/* =========================
   COPY
========================= */

function copyStory(id){

  const item = sahaba.find(x => x.id === id);

  if(!item) return;

  const text =
`${item.name}

${item.arabic}

${item.story}

Barumsa:
${item.lessons.map(x=>"• "+x).join("\n")}`;

  navigator.clipboard.writeText(text)
    .then(() => {
      alert("Seenaa kana copy gooteetta.");
    });

}


/* =========================
   START
========================= */

renderList(sahaba);

</script>

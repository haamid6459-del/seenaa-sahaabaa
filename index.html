<title>SahaabaHub — Seenaa Sahaabaa</title>

<style>
:root{
  --bg:#f5f7f8;
  --card:#ffffff;
  --text:#17201d;
  --muted:#68756f;
  --primary:#087f5b;
  --primary2:#075c43;
  --border:#dce5e1;
  --gold:#c99a27;
  --danger:#c62828;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#101614;
  --card:#18211e;
  --text:#f2f5f3;
  --muted:#aebbb5;
  --border:#2c3a35;
}

header{
  background:linear-gradient(135deg,var(--primary2),var(--primary));
  color:white;
  padding:22px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:6px;
  font-size:14px;
  opacity:.9;
}

.top-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}

.top-actions button{
  border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12);
  color:white;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
}

.container{
  width:min(1100px,94%);
  margin:20px auto;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  padding:15px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  font-size:16px;
  outline:none;
}

.search-box button{
  border:0;
  background:var(--primary);
  color:white;
  padding:0 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:18px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:15px;
}

.categories button{
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 14px;
  border-radius:20px;
  cursor:pointer;
}

.categories button.active{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.tools{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.tools button{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#e7f3ef;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  flex-shrink:0;
}

body.dark .avatar{
  background:#23352e;
}

.card h3{
  margin:0;
  font-size:18px;
}

.arabic{
  direction:rtl;
  text-align:right;
  font-size:19px;
  margin:6px 0;
  color:var(--gold);
}

.badge{
  display:inline-block;
  background:#e9f5f1;
  color:var(--primary2);
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
  margin-top:5px;
}

body.dark .badge{
  background:#21352e;
  color:#a8dfca;
}

.card p{
  line-height:1.6;
  color:var(--muted);
}

.card-buttons{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.card-buttons button{
  flex:1;
  border:0;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
}

.view-btn{
  background:var(--primary);
  color:white;
}

.fav-btn{
  background:#f1f3f2;
  color:var(--text);
}

body.dark .fav-btn{
  background:#27312e;
}

.empty{
  text-align:center;
  padding:40px 15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  color:var(--muted);
}

.hidden{
  display:none !important;
}

.detail{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.detail-header{
  text-align:center;
  margin-bottom:20px;
}

.detail-icon{
  font-size:50px;
}

.detail h1{
  margin:8px 0;
}

.detail-arabic{
  direction:rtl;
  font-size:25px;
  color:var(--gold);
}

.detail section{
  margin-top:20px;
}

.detail h2{
  color:var(--primary);
}

.detail p{
  line-height:1.9;
  color:var(--muted);
}

.back-btn{
  border:0;
  background:var(--primary);
  color:white;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:15px;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
  font-size:13px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  z-index:100;
  display:none;
}

.error-box{
  background:#ffebee;
  color:#b71c1c;
  border:1px solid #ef9a9a;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

@media(max-width:600px){
  .logo{
    font-size:25px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .search-box button{
    padding:0 14px;
  }
}
</style>
</head>

    <div id="cards" class="grid"></div>

  <div id="detailView" class="hidden">

  </div>

</main>

<footer>
  SahaabaHub — Barnoota, Seenaa fi Fakkeenya Sahaabota رضي الله عنهم

/* =========================
   VARIABLES
========================= */

let currentCategory = "all";
let currentSearch = "";
let favoritesOnly = false;
let currentId = null;

/* =========================
   ELEMENTS
========================= */

const cardsEl = document.getElementById("cards");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const countText = document.getElementById("countText");
const homeView = document.getElementById("homeView");
const detailView = document.getElementById("detailView");
const detailContent = document.getElementById("detailContent");
const backBtn = document.getElementById("backBtn");
const randomBtn = document.getElementById("randomBtn");
const darkBtn = document.getElementById("darkBtn");
const favOnlyBtn = document.getElementById("favOnlyBtn");
const clearBtn = document.getElementById("clearBtn");
const toast = document.getElementById("toast");
const errorBox = document.getElementById("errorBox");

/* =========================
   SAFE STORAGE
========================= */

function getFavorites(){
  try{
    return JSON.parse(localStorage.getItem("sahaaba_favorites") || "[]");
  }catch(e){
    return [];
  }
}

function saveFavorites(list){
  try{
    localStorage.setItem("sahaaba_favorites", JSON.stringify(list));
  }catch(e){}
}

function isFavorite(id){
  return getFavorites().includes(id);
}

/* =========================
   NORMALIZE SEARCH
========================= */

function normalizeText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .trim();
}

/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================
   FILTER
========================= */

function getFilteredData(){

  const query = normalizeText(currentSearch);

  return sahaba.filter(person => {

    const categoryOK =
      currentCategory === "all" ||
      person.categories.includes(currentCategory);

    const text = normalizeText([
      person.name,
      person.arabic,
      person.short,
      person.story,
      person.lesson,
      person.categories.join(" ")
    ].join(" "));

    const searchOK =
      !query || text.includes(query);

    const favoriteOK =
      !favoritesOnly || isFavorite(person.id);

    return categoryOK && searchOK && favoriteOK;
  });
}

/* =========================
   RENDER CARDS
========================= */

function renderCards(){

  const data = getFilteredData();

  countText.textContent = data.length + " Sahaabaa";

  if(data.length === 0){
    cardsEl.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;">🔎</div>
        <h3>Homaa hin argamne</h3>
        <p>Maqaa ykn jecha biraa yaali.</p>
      </div>
    `;
    return;
  }

  cardsEl.innerHTML = data.map(person => {

    const fav = isFavorite(person.id);

    return `
      <article class="card">

        <div class="card-top">

          <div>
            <h3>${escapeHTML(person.name)}</h3>
            <div class="arabic">${escapeHTML(person.arabic)}</div>
            <span class="badge">
              ${person.gender === "female" ? "Sahaabiyyah" : "Sahaabaa"}
            </span>
          </div>

          <div class="avatar">
            ${person.gender === "female" ? "👩" : "👤"}
          </div>

        </div>

        <p>${escapeHTML(person.short)}</p>

        <div class="card-buttons">

          <button
            class="view-btn"
            data-action="view"
            data-id="${person.id}">
            Ilaali
          </button>

          <button
            class="fav-btn"
            data-action="favorite"
            data-id="${person.id}">
            ${fav ? "❤️" : "🤍"}
          </button>

        </div>

      </article>
    `;

  }).join("");
}

/* =========================
   DETAIL
========================= */

function openDetail(id){

  const person = sahaba.find(item => item.id === Number(id));

  if(!person) return;

  currentId = person.id;

  homeView.classList.add("hidden");
  detailView.classList.remove("hidden");

  const fav = isFavorite(person.id);

  detailContent.innerHTML = `

    <div class="detail-header">

      <div class="detail-icon">
        ${person.gender === "female" ? "👩" : "👤"}
      </div>

      <h1>${escapeHTML(person.name)}</h1>

      <div class="detail-arabic">
        ${escapeHTML(person.arabic)}
      </div>

      <span class="badge">
        ${person.gender === "female" ? "Sahaabiyyah" : "Sahaabaa"}
      </span>

    </div>

    <section>
      <h2>📖 Seenaa gabaabaa</h2>
      <p>${escapeHTML(person.story)}</p>
    </section>

    <section>
      <h2>💡 Barumsa irraa argannu</h2>
      <p>${escapeHTML(person.lesson)}</p>
    </section>

    <section>
      <h2>📚 Maddoota</h2>
      <p>${escapeHTML(person.source)}</p>
    </section>

    <button
      class="back-btn"
      id="detailFavoriteBtn">
      ${fav ? "❤️ Jaalatamoo keessaa baasi" : "🤍 Jaalatamoo keessa kaa'i"}
    </button>

    <button
      class="back-btn"
      id="shareBtn">
      📤 Qoodi
    </button>

  `;

  document.getElementById("detailFavoriteBtn")
    .addEventListener("click",function(){
      toggleFavorite(person.id);
      openDetail(person.id);
    });

  document.getElementById("shareBtn")
    .addEventListener("click",function(){
      sharePerson(person);
    });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================
   BACK
========================= */

function showHome(){

  detailView.classList.add("hidden");
  homeView.classList.remove("hidden");

  currentId = null;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================
   FAVORITE
========================= */

function toggleFavorite(id){

  let list = getFavorites();

  if(list.includes(id)){
    list = list.filter(item => item !== id);
    showToast("Jaalatamoo keessaa baafame");
  }else{
    list.push(id);
    showToast("Jaalatamoo keessa kaa'ame ❤️");
  }

  saveFavorites(list);

  renderCards();
}

/* =========================
   SHARE
========================= */

async function sharePerson(person){

  const text =
    person.name +
    "\n" +
    person.arabic +
    "\n\n" +
    person.story +
    "\n\nSahaabaHub";

  try{

    if(navigator.share){

      await navigator.share({
        title:person.name,
        text:text
      });

    }else if(navigator.clipboard){

      await navigator.clipboard.writeText(text);
      showToast("Barreeffamni copy ta'e");

    }else{

      showToast("Qooduun browser kana keessatti hin deeggaramne");

    }

  }catch(e){}
}

/* =========================
   RANDOM
========================= */

function randomPerson(){

  const data = getFilteredData();

  if(data.length === 0){
    showToast("Sahaabaa argamu hin jiru");
    return;
  }

  const item =
    data[Math.floor(Math.random() * data.length)];

  openDetail(item.id);
}

/* =========================
   SEARCH
========================= */

function doSearch(){

  currentSearch = searchInput.value;

  favoritesOnly = false;

  renderCards();
}

/* =========================
   CLEAR
========================= */

function clearAll(){

  currentSearch = "";
  searchInput.value = "";
  currentCategory = "all";
  favoritesOnly = false;

  document.querySelectorAll(".cat")
    .forEach(btn => btn.classList.remove("active"));

  const allBtn =
    document.querySelector('.cat[data-category="all"]');

  if(allBtn){
    allBtn.classList.add("active");
  }

  renderCards();
}

/* =========================
   DARK MODE
========================= */

function loadDarkMode(){

  try{

    const dark =
      localStorage.getItem("sahaaba_dark") === "yes";

    if(dark){
      document.body.classList.add("dark");
      darkBtn.textContent = "☀️ Guyyaa";
    }

  }catch(e){}

}

function toggleDark(){

  document.body.classList.toggle("dark");

  const isDark =
    document.body.classList.contains("dark");

  darkBtn.textContent =
    isDark ? "☀️ Guyyaa" : "🌙 Halkan";

  try{
    localStorage.setItem(
      "sahaaba_dark",
      isDark ? "yes" : "no"
    );
  }catch(e){}
}

/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(message){

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.style.display = "none";
  },2200);
}

/* =========================
   EVENTS
========================= */

searchBtn.addEventListener("click",doSearch);

searchInput.addEventListener("input",function(){

  currentSearch = this.value;
  renderCards();

});

searchInput.addEventListener("keydown",function(event){

  if(event.key === "Enter"){
    doSearch();
  }

});

document.querySelectorAll(".cat")
.forEach(button => {

  button.addEventListener("click",function(){

    currentCategory =
      this.dataset.category;

    favoritesOnly = false;

    document.querySelectorAll(".cat")
      .forEach(btn => btn.classList.remove("active"));

    this.classList.add("active");

    renderCards();

  });

});

cardsEl.addEventListener("click",function(event){

  const button =
    event.target.closest("button");

  if(!button) return;

  const id =
    Number(button.dataset.id);

  const action =
    button.dataset.action;

  if(action === "view"){
    openDetail(id);
  }

  if(action === "favorite"){
    toggleFavorite(id);
  }

});

backBtn.addEventListener("click",showHome);

randomBtn.addEventListener("click",randomPerson);

darkBtn.addEventListener("click",toggleDark);

clearBtn.addEventListener("click",clearAll);

favOnlyBtn.addEventListener("click",function(){

  favoritesOnly = !favoritesOnly;

  this.textContent =
    favoritesOnly
      ? "❤️ Jaalatamoo qofa"
      : "❤️ Jaalatamoo";

  renderCards();

});

/* =========================
   START APP
========================= */

function startApp(){

  try{

    loadDarkMode();
    renderCards();

  }catch(error){

    errorBox.classList.remove("hidden");

    errorBox.textContent =
      "Rakkoon app keessatti uumame: " +
      error.message;

  }

}

startApp();

</script>
